<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaceWatch Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111;
      --panel: #1a1a1a;
      --border: #333;
      --accent: #e10600;
      --accent-hover: #ff1a1a;
      --text: #eee;
      --text-muted: #999;
      --radius: 6px;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Toolbar ───────────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--panel);
      border-bottom: 2px solid var(--accent);
      flex-wrap: wrap;
      z-index: 100;
    }

    #toolbar h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent);
      margin-right: 12px;
      white-space: nowrap;
    }

    #toolbar h1 span { color: var(--text); }

    .toolbar-btn {
      padding: 5px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: .82rem;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }

    .toolbar-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .toolbar-sep {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 4px;
    }

    /* ── (layout selector removed – using auto‑size) ── */

    /* ── Grid container (flex‑wrap for free‑form sizing) ─ */
    #grid {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 3px;
      padding: 3px;
      height: calc(100vh - 46px);
      overflow: auto;
      background: var(--bg);
    }

    /* ── Cell (each panel) ────────────────────────────── */
    .cell {
      position: relative;
      background: #000;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 200px;
      min-height: 120px;
    }

    .cell-header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: .75rem;
    }

    .cell-header .label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-muted);
    }

    .cell-header .cell-type-badge {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .cell-type-badge.stream { background: var(--accent); color: #fff; }
    .cell-type-badge.onboard { background: #1565c0; color: #fff; }
    .cell-type-badge.timing { background: #2e7d32; color: #fff; }

    .cell-header button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: .85rem;
      padding: 0 3px;
      line-height: 1;
    }

    .cell-header button:hover { color: var(--accent); }

    .cell-body {
      flex: 1;
      position: relative;
    }

    .cell-body iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Empty‑state placeholder */
    .cell-body .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: .85rem;
      text-align: center;
      padding: 12px;
    }

    /* ── Modal ─────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      min-width: 380px;
      max-width: 90vw;
    }

    .modal h2 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .modal label {
      display: block;
      font-size: .8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      margin-top: 10px;
    }

    .modal input, .modal select {
      width: 100%;
      padding: 7px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .85rem;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 6px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: .82rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent) !important;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--panel);
      color: var(--text);
    }

    .btn-secondary:hover { background: var(--border); }

    /* ── Fullscreen on a cell ──────────────────────────── */
    .cell.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 150;
      border-radius: 0;
      border: none;
      min-height: unset;
      min-width: unset;
    }

    /* ── Resize handles ──────────────────────────────── */
    .resize-handle {
      position: absolute;
      z-index: 10;
    }
    .resize-handle:hover {
      background: rgba(225, 6, 0, 0.25);
    }
    .resize-n  { top: 0; left: 8px; right: 8px; height: 4px; cursor: n-resize; }
    .resize-s  { bottom: 0; left: 8px; right: 8px; height: 4px; cursor: s-resize; }
    .resize-e  { right: 0; top: 8px; bottom: 8px; width: 4px; cursor: e-resize; }
    .resize-w  { left: 0; top: 8px; bottom: 8px; width: 4px; cursor: w-resize; }
    .resize-ne { top: 0; right: 0; width: 10px; height: 10px; cursor: ne-resize; }
    .resize-nw { top: 0; left: 0; width: 10px; height: 10px; cursor: nw-resize; }
    .resize-se { bottom: 0; right: 0; width: 10px; height: 10px; cursor: se-resize; }
    .resize-sw { bottom: 0; left: 0; width: 10px; height: 10px; cursor: sw-resize; }

    body.resizing iframe { pointer-events: none; }
    body.resizing { user-select: none; }

    /* ── Drag‑and‑drop reordering ─────────────────── */
    .cell-header {
      cursor: grab;
    }

    .cell-header button {
      cursor: pointer;   /* buttons keep pointer cursor */
    }

    body.dragging { user-select: none; cursor: grabbing !important; }
    body.dragging iframe { pointer-events: none; }
    body.dragging .cell-header { cursor: grabbing; }

    .drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 300;
      opacity: .65;
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
      overflow: hidden;
      transition: none;
    }

    .cell.drag-source {
      opacity: .25;
    }

    .drop-indicator {
      position: fixed;
      background: var(--accent);
      border-radius: 2px;
      pointer-events: none;
      box-shadow: 0 0 8px var(--accent);
      z-index: 50;
    }
  </style>
</head>
<body>

<!-- ── Toolbar ──────────────────────────────────────── -->
<div id="toolbar">
  <h1>🏁 RACE<span>WATCH</span></h1>

  <button class="toolbar-btn" onclick="openAddModal('stream')" title="Add main stream">+ Stream</button>
  <button class="toolbar-btn" onclick="openAddModal('onboard')" title="Add onboard camera">+ Onboard</button>
  <button class="toolbar-btn" onclick="openAddModal('timing')" title="Add live timing">+ Timing</button>

  <div class="toolbar-sep"></div>

  <button class="toolbar-btn" onclick="autoSizeAll()" title="Auto‑size all panels to fill viewport">Auto Size</button>

  <div class="toolbar-sep"></div>

  <button class="toolbar-btn" onclick="removeAll()" title="Remove all panels">Clear All</button>
</div>

<!-- ── Grid ─────────────────────────────────────────── -->
<div id="grid"></div>

<!-- ── Modal placeholder ───────────────────────────── -->
<div id="modal-root"></div>

<script>
/* ============================================================
   RaceWatch Dashboard – single‑file logic
   ============================================================ */

const grid = document.getElementById('grid');
const modalRoot = document.getElementById('modal-root');

let cells = [];  // { id, type, url, label }
let nextId = 1;

/* ── YouTube URL → embed URL ──────────────────────── */
function toEmbedUrl(raw) {
  if (!raw) return '';
  let url = raw.trim();

  // Already an embed URL
  if (url.includes('youtube.com/embed/')) return url;

  let videoId = null;

  // https://youtu.be/VIDEO_ID
  const shortMatch = url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
  if (shortMatch) videoId = shortMatch[1];

  // https://www.youtube.com/watch?v=VIDEO_ID
  if (!videoId) {
    const longMatch = url.match(/[?&]v=([A-Za-z0-9_-]{11})/);
    if (longMatch) videoId = longMatch[1];
  }

  // https://www.youtube.com/live/VIDEO_ID
  if (!videoId) {
    const liveMatch = url.match(/youtube\.com\/live\/([A-Za-z0-9_-]{11})/);
    if (liveMatch) videoId = liveMatch[1];
  }

  if (videoId) {
    return 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&mute=1';
  }

  // Not a recognized YouTube URL → return as-is (could be another embed)
  return url;
}

/* ── Auto‑size helpers ─────────────────────────────── */
const FLEX_DEFAULTS = {
  stream:  { grow: 2, basis: 500 },
  timing:  { grow: 1, basis: 300 },
  onboard: { grow: 1, basis: 280 }
};

function computeAutoHeights() {
  const cw  = grid.clientWidth  - 6;
  const ch  = grid.clientHeight - 6;
  const gap = 3;

  /* estimate how many rows the flex‑wrap will produce */
  let rowWidth = 0;
  let rows = 1;
  cells.forEach(c => {
    const basis = (FLEX_DEFAULTS[c.type] || FLEX_DEFAULTS.onboard).basis;
    if (rowWidth + basis + gap > cw && rowWidth > 0) { rows++; rowWidth = 0; }
    rowWidth += basis + gap;
  });
  return Math.max(180, Math.floor((ch - (rows - 1) * gap) / rows));
}

/* ── Render grid ──────────────────────────────────── */
function render() {
  grid.innerHTML = '';

  if (cells.length === 0) {
    grid.innerHTML = `
      <div style="width:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:1.1rem;height:100%;">
        Click <b style="color:var(--accent);margin:0 6px;">+ Stream</b>,
        <b style="color:#1565c0;margin:0 6px;">+ Onboard</b> or
        <b style="color:#2e7d32;margin:0 6px;">+ Timing</b> to get started.
      </div>`;
    return;
  }

  const autoH = computeAutoHeights();

  cells.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cell';
    el.dataset.id = c.id;

    /* sizing: explicit (manual) or flex (auto) */
    if (c.w && c.h) {
      el.style.width  = c.w + 'px';
      el.style.height = c.h + 'px';
      el.style.flex   = 'none';
    } else {
      const def = FLEX_DEFAULTS[c.type] || FLEX_DEFAULTS.onboard;
      el.style.flex   = `${def.grow} 1 ${def.basis}px`;
      el.style.height = autoH + 'px';
    }

    const badgeClass = c.type === 'stream' ? 'stream' : c.type === 'onboard' ? 'onboard' : 'timing';
    const typeLabel  = badgeClass === 'stream' ? 'Stream' : badgeClass === 'onboard' ? 'Onboard' : 'Timing';

    el.innerHTML = `
      <div class="cell-header">
        <span class="cell-type-badge ${badgeClass}">${typeLabel}</span>
        <span class="label" title="${escapeHtml(c.label || c.url)}">${escapeHtml(c.label || c.url)}</span>
        <button title="Edit" onclick="openEditModal(${c.id})">&#9998;</button>
        <button title="Fullscreen" onclick="toggleFullscreen(${c.id})">&#x26F6;</button>
        <button title="Remove" onclick="removeCell(${c.id})">&times;</button>
      </div>
      <div class="cell-body">
        ${c.url
          ? `<iframe src="${escapeHtml(c.type === 'timing' ? c.url : toEmbedUrl(c.url))}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`
          : `<div class="empty">No URL set – click ✎ to edit</div>`}
      </div>`;

    /* ── resize handles (all 8 directions) ─── */
    ['n','s','e','w','ne','nw','se','sw'].forEach(dir => {
      const h = document.createElement('div');
      h.className = `resize-handle resize-${dir}`;
      h.addEventListener('mousedown', e => initResize(e, c.id, dir));
      el.appendChild(h);
    });

    /* ── drag handle (cell header) ─── */
    const header = el.querySelector('.cell-header');
    if (header) header.addEventListener('mousedown', e => initDrag(e, c.id));

    grid.appendChild(el);
  });
}

/* ── Cell management ──────────────────────────────── */
function addCell(type, url, label) {
  cells.push({ id: nextId++, type, url: url || '', label: label || '' });
  render();
  saveState();
}

function updateCell(id, url, label) {
  const c = cells.find(c => c.id === id);
  if (!c) return;
  c.url = url;
  c.label = label;
  render();
  saveState();
}

function removeCell(id) {
  cells = cells.filter(c => c.id !== id);
  render();
  saveState();
}

function removeAll() {
  if (cells.length && !confirm('Remove all panels?')) return;
  cells = [];
  render();
  saveState();
}

/* ── Auto‑size all cells ──────────────────────────── */
function autoSizeAll() {
  cells.forEach(c => { delete c.w; delete c.h; });
  render();
  saveState();
}

/* Re‑auto‑size when the window is resized (only for auto‑sized cells) */
window.addEventListener('resize', () => {
  if (cells.some(c => !c.w || !c.h)) render();
});

/* ── Resize logic ────────────────────────────────── */
let _resize = null;

function initResize(e, cellId, dir) {
  e.preventDefault();
  e.stopPropagation();
  const cellEl = grid.querySelector(`.cell[data-id="${cellId}"]`);
  if (!cellEl) return;

  _resize = {
    id:   cellId,
    dir:  dir,
    sx:   e.clientX,
    sy:   e.clientY,
    sw:   cellEl.offsetWidth,
    sh:   cellEl.offsetHeight,
    el:   cellEl
  };

  document.body.classList.add('resizing');
  document.addEventListener('mousemove', doResize);
  document.addEventListener('mouseup',   stopResize);
}

function doResize(e) {
  if (!_resize) return;
  const dx = e.clientX - _resize.sx;
  const dy = e.clientY - _resize.sy;
  const d  = _resize.dir;

  let nw = _resize.sw;
  let nh = _resize.sh;

  if (d.includes('e')) nw = _resize.sw + dx;
  if (d.includes('w')) nw = _resize.sw - dx;
  if (d.includes('s')) nh = _resize.sh + dy;
  if (d.includes('n')) nh = _resize.sh - dy;

  nw = Math.max(200, nw);
  nh = Math.max(120, nh);

  _resize.el.style.width  = nw + 'px';
  _resize.el.style.height = nh + 'px';
  _resize.el.style.flex   = 'none';
}

function stopResize() {
  if (!_resize) return;
  const cell = cells.find(x => x.id === _resize.id);
  if (cell) {
    cell.w = _resize.el.offsetWidth;
    cell.h = _resize.el.offsetHeight;
    saveState();
  }
  document.body.classList.remove('resizing');
  document.removeEventListener('mousemove', doResize);
  document.removeEventListener('mouseup',   stopResize);
  _resize = null;
}

/* ── Drag‑and‑drop reordering ────────────────────── */
let _drag = null;

function initDrag(e, cellId) {
  /* ignore right‑click, buttons inside header, resize handles */
  if (e.button !== 0) return;
  if (e.target.closest('button')) return;

  e.preventDefault();

  const cellEl = grid.querySelector(`.cell[data-id="${cellId}"]`);
  if (!cellEl) return;

  const rect = cellEl.getBoundingClientRect();

  /* create ghost (shallow clone – no iframes to avoid reloading) */
  const ghost = cellEl.cloneNode(true);
  ghost.className = 'drag-ghost';
  ghost.style.width  = rect.width  + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.left   = rect.left   + 'px';
  ghost.style.top    = rect.top    + 'px';
  /* strip iframes from ghost to keep it lightweight */
  ghost.querySelectorAll('iframe').forEach(f => {
    const ph = document.createElement('div');
    ph.style.cssText = 'width:100%;height:100%;background:#222;';
    f.replaceWith(ph);
  });
  document.body.appendChild(ghost);

  _drag = {
    id:     cellId,
    el:     cellEl,
    ghost:  ghost,
    ox:     e.clientX - rect.left,
    oy:     e.clientY - rect.top,
    started: false,
    sx:     e.clientX,
    sy:     e.clientY
  };

  document.addEventListener('mousemove', doDrag);
  document.addEventListener('mouseup',   stopDrag);
}

function doDrag(e) {
  if (!_drag) return;

  /* require minimum movement before starting visible drag */
  if (!_drag.started) {
    const dx = Math.abs(e.clientX - _drag.sx);
    const dy = Math.abs(e.clientY - _drag.sy);
    if (dx < 5 && dy < 5) return;
    _drag.started = true;
    _drag.el.classList.add('drag-source');
    document.body.classList.add('dragging');
  }

  /* move ghost */
  _drag.ghost.style.left = (e.clientX - _drag.ox) + 'px';
  _drag.ghost.style.top  = (e.clientY - _drag.oy) + 'px';

  /* show drop indicator */
  updateDropIndicator(e.clientX, e.clientY);
}

/* helpers for clamped axis distance */
function _clampV(y, top, bot) { return y < top ? top - y : y > bot ? y - bot : 0; }
function _clampH(x, left, right) { return x < left ? left - x : x > right ? x - right : 0; }

function updateDropIndicator(mx, my) {
  /* remove old indicator */
  const old = document.querySelector('.drop-indicator');
  if (old) old.remove();

  const cellEls = Array.from(grid.querySelectorAll('.cell'));
  if (cellEls.length < 2) return;

  let best = null;
  let bestDist = Infinity;

  cellEls.forEach((el, i) => {
    if (el === _drag.el) return;
    const r = el.getBoundingClientRect();

    /* Left edge – reorder before (horizontal) */
    const dL = Math.abs(mx - r.left) + _clampV(my, r.top, r.bottom);
    if (dL < bestDist) { bestDist = dL; best = { mode: 'v', pos: 'before', el, i, x: r.left, y1: r.top, y2: r.bottom }; }

    /* Right edge – reorder after (horizontal) */
    const dR = Math.abs(mx - r.right) + _clampV(my, r.top, r.bottom);
    if (dR < bestDist) { bestDist = dR; best = { mode: 'v', pos: 'after', el, i, x: r.right, y1: r.top, y2: r.bottom }; }

    /* Top edge – drop above (vertical stack) */
    const dT = Math.abs(my - r.top) + _clampH(mx, r.left, r.right);
    if (dT < bestDist) { bestDist = dT; best = { mode: 'h', pos: 'above', el, i, y: r.top, x1: r.left, x2: r.right }; }

    /* Bottom edge – drop below (vertical stack) */
    const dB = Math.abs(my - r.bottom) + _clampH(mx, r.left, r.right);
    if (dB < bestDist) { bestDist = dB; best = { mode: 'h', pos: 'below', el, i, y: r.bottom, x1: r.left, x2: r.right }; }
  });

  if (!best) return;
  _drag.dropInfo = best;

  /* draw fixed‑position indicator */
  const ind = document.createElement('div');
  ind.className = 'drop-indicator';
  if (best.mode === 'v') {
    ind.style.left   = (best.x - 2) + 'px';
    ind.style.top    = best.y1 + 'px';
    ind.style.width  = '4px';
    ind.style.height = (best.y2 - best.y1) + 'px';
  } else {
    ind.style.left   = best.x1 + 'px';
    ind.style.top    = (best.y - 2) + 'px';
    ind.style.width  = (best.x2 - best.x1) + 'px';
    ind.style.height = '4px';
  }
  document.body.appendChild(ind);
}

function stopDrag() {
  document.removeEventListener('mousemove', doDrag);
  document.removeEventListener('mouseup',   stopDrag);

  if (!_drag) return;

  /* remove ghost & indicator */
  _drag.ghost.remove();
  const ind = document.querySelector('.drop-indicator');
  if (ind) ind.remove();

  if (_drag.started && _drag.dropInfo) {
    const info = _drag.dropInfo;
    const fromIdx = cells.findIndex(c => c.id === _drag.id);
    const targetId = parseInt(info.el.dataset.id, 10);
    const toBaseIdx = cells.findIndex(c => c.id === targetId);

    if (fromIdx !== -1 && toBaseIdx !== -1 && fromIdx !== toBaseIdx) {
      const [moved] = cells.splice(fromIdx, 1);

      /* recalculate target index after removal */
      let insertIdx = cells.findIndex(c => c.id === targetId);
      if (info.pos === 'after' || info.pos === 'below') {
        insertIdx += 1;
      }
      cells.splice(insertIdx, 0, moved);

      /* vertical stack: set both cells to full width and 50/50 height */
      if (info.mode === 'h') {
        const target = cells.find(c => c.id === targetId);
        const availH = grid.clientHeight - 6;          /* minus padding */
        const halfH  = Math.max(120, Math.floor((availH - 3) / 2)); /* minus gap */
        const fullW  = grid.clientWidth - 6;

        moved.w  = fullW;
        moved.h  = halfH;
        target.w = fullW;
        target.h = halfH;
      }

      saveState();
    }
  }

  if (_drag.started) {
    _drag.el.classList.remove('drag-source');
    document.body.classList.remove('dragging');
  }
  _drag = null;
  render();
}

/* ── Fullscreen toggle ────────────────────────────── */
function toggleFullscreen(id) {
  const el = grid.querySelector(`.cell[data-id="${id}"]`);
  if (!el) return;
  el.classList.toggle('fullscreen');
}

/* Close fullscreen on Escape */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.cell.fullscreen').forEach(el => el.classList.remove('fullscreen'));
    closeModal();
  }
});

/* ── Modals ────────────────────────────────────────── */
function openAddModal(type) {
  const typeLabel = type === 'stream' ? 'Stream' : type === 'onboard' ? 'Onboard' : 'Live Timing';
  const placeholder = type === 'timing'
    ? 'https://livetiming.azurewebsites.net/event=50'
    : 'https://youtu.be/9FJKUkAVz1U';

  modalRoot.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>Add ${typeLabel}</h2>
        <label for="m-url">URL</label>
        <input id="m-url" type="text" placeholder="${placeholder}" autofocus />
        <label for="m-label">Label (optional)</label>
        <input id="m-label" type="text" placeholder="e.g. VER onboard" />
        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="submitAdd('${type}')">Add</button>
        </div>
      </div>
    </div>`;

  modalRoot.querySelector('#m-url').focus();
  modalRoot.querySelector('#m-url').addEventListener('keydown', e => { if (e.key === 'Enter') submitAdd(type); });
  modalRoot.querySelector('#m-label').addEventListener('keydown', e => { if (e.key === 'Enter') submitAdd(type); });
}

function submitAdd(type) {
  const url = document.getElementById('m-url').value.trim();
  const label = document.getElementById('m-label').value.trim();
  addCell(type, url, label);
  closeModal();
}

function openEditModal(id) {
  const c = cells.find(c => c.id === id);
  if (!c) return;

  const typeLabel = c.type === 'stream' ? 'Stream' : c.type === 'onboard' ? 'Onboard' : 'Live Timing';

  modalRoot.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>Edit ${typeLabel}</h2>
        <label for="m-url">URL</label>
        <input id="m-url" type="text" value="${escapeAttr(c.url)}" />
        <label for="m-label">Label</label>
        <input id="m-label" type="text" value="${escapeAttr(c.label)}" />
        <label for="m-type">Type</label>
        <select id="m-type">
          <option value="stream" ${c.type === 'stream' ? 'selected' : ''}>Stream</option>
          <option value="onboard" ${c.type === 'onboard' ? 'selected' : ''}>Onboard</option>
          <option value="timing" ${c.type === 'timing' ? 'selected' : ''}>Timing</option>
        </select>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="submitEdit(${id})">Save</button>
        </div>
      </div>
    </div>`;

  modalRoot.querySelector('#m-url').focus();
  modalRoot.querySelector('#m-url').addEventListener('keydown', e => { if (e.key === 'Enter') submitEdit(id); });
  modalRoot.querySelector('#m-label').addEventListener('keydown', e => { if (e.key === 'Enter') submitEdit(id); });
}

function submitEdit(id) {
  const url = document.getElementById('m-url').value.trim();
  const label = document.getElementById('m-label').value.trim();
  const type = document.getElementById('m-type').value;
  const c = cells.find(c => c.id === id);
  if (c) { c.type = type; }
  updateCell(id, url, label);
  closeModal();
}

function closeModal() {
  modalRoot.innerHTML = '';
}

/* ── Persistence (localStorage) ───────────────────── */
function saveState() {
  localStorage.setItem('rw-cells', JSON.stringify(cells));
  localStorage.setItem('rw-nextId', nextId);
}

function loadState() {
  try {
    const raw = localStorage.getItem('rw-cells');
    if (raw) {
      cells = JSON.parse(raw);
      nextId = parseInt(localStorage.getItem('rw-nextId') || '1', 10);
    }
  } catch { /* ignore corrupt state */ }
  render();
}

/* ── Helpers ──────────────────────────────────────── */
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escapeAttr(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Boot ─────────────────────────────────────────── */
loadState();
</script>
</body>
</html>
